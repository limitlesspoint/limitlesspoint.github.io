<!doctype html>
<html lang="en" data-decade="now" data-section="home" data-default>
<head>
<meta charset="utf-8">
<script src="dial.js?v=bc9c5fff"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Ayub Kharel</title>
<meta name="description" content="Ayub Kharel works on the safety, security and alignment of large language models at the University of Oxford.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0f12'/%3E%3Ccircle cx='23' cy='9' r='4' fill='%23ff4f00'/%3E%3Cpath d='M7 25l6-16 6 16M9.5 19h7' stroke='%23f3f4ef' stroke-width='2.6' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a lab instrument for the present day. Hero = a crew of tiny agents building the wordmark + a spec panel
   (portrait, coordinates, a timeline). Then bio with a toy attention view, a news timeline,
   three live instruments for the research interests, and the papers. */
:root {
  --bg: #f3f4ef; --panel: #ffffff; --ink: #0d0f12; --mute: #5b6169; --line: rgba(13, 15, 18, .12); --soft: rgba(13, 15, 18, .05);
  --accent: #ff4f00; --crit: #d97757; --blue: #2f5bff; --metal-a: #e9eaec; --metal-b: #a7abb1;
  --f-d: "Unbounded", "Arial Black", system-ui, sans-serif; --f: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --f-m: "Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0c0e; --panel: #131519; --ink: #eef0f3; --mute: #99a0aa; --line: rgba(255, 255, 255, .1); --soft: rgba(255, 255, 255, .04); --accent: #ff6a1f; --blue: #6f8bff; --metal-a: #3a3e45; --metal-b: #16181c; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0b0c0e; --panel: #131519; --ink: #eef0f3; --mute: #99a0aa; --line: rgba(255, 255, 255, .1); --soft: rgba(255, 255, 255, .04); --accent: #ff6a1f; --blue: #6f8bff; --metal-a: #3a3e45; --metal-b: #16181c; color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
a { color: inherit; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
a:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-m); }
.label { font: 500 .72rem var(--f-m); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }

/* bad apple: the page drains to black and white while the portrait "generates" the video */
:root.shadow { --accent: var(--ink); --blue: var(--ink); --crit: var(--ink); }
:root.shadow .bar, :root.shadow main > section:not(.hero), :root.shadow .stage, :root.shadow .readouts, :root.shadow .epoch, :root.shadow footer { filter: grayscale(1) contrast(1.15); }
.portrait .genvid { position: absolute; inset: 0; z-index: 3; background: #000; }
.portrait .genvid video { object-fit: cover !important; }
.portrait .genx { position: absolute; top: 8px; right: 8px; z-index: 4; width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); background: rgba(0,0,0,.6); color: #fff; font: 600 14px/1 var(--f-m); cursor: pointer; }
.portrait .genx[hidden] { display: none; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
.mark { font: 800 1.05rem var(--f-d); letter-spacing: -.02em; text-decoration: none; display: flex; align-items: center; gap: 8px; }
.mark i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
.bar nav { display: flex; gap: 4px; margin-left: auto; }
.bar nav a { font: 500 .9rem var(--f); text-decoration: none; padding: 6px 12px; border-radius: 999px; color: var(--mute); }
.bar nav a:hover { color: var(--ink); background: var(--soft); }
.kbtn { display: flex; align-items: center; gap: 8px; font: 500 .82rem var(--f-m); color: var(--mute); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; cursor: pointer; }
.kbtn kbd { font: inherit; padding: 1px 6px; border-radius: 6px; background: var(--soft); border: 1px solid var(--line); color: var(--ink); }
.theme { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: grid; place-items: center; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; padding-block: 36px 24px; align-items: stretch; }
.stage { position: relative; min-height: 400px; border: 1px solid var(--line); border-radius: 22px; background: var(--panel); overflow: hidden; display: grid; align-content: end; padding: 26px; }
.stage::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 32px 32px; opacity: .45; -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%); }
#particles { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: crosshair; }
.crew { position: absolute; right: 18px; top: 16px; font-size: .64rem; letter-spacing: .08em; color: var(--mute); pointer-events: none; }
.stage .sr-name { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.fallback-name { position: absolute; left: 26px; right: 26px; top: 36%; font: 800 clamp(2.6rem, 7vw, 5.4rem)/0.95 var(--f-d); letter-spacing: -.04em; }
.particles-on .fallback-name { visibility: hidden; }
.aligned { position: relative; display: inline-grid; gap: 0; font: 600 clamp(1.5rem, 3.2vw, 2.3rem)/1 var(--f-d); letter-spacing: -.02em; width: max-content; }
.aligned span { display: block; }
.aligned .guide { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 1.5px dashed var(--accent); }
.aligned .g1 { left: 0; } .aligned .g2 { left: var(--gx, 1.1em); }
.aligned .tick { position: absolute; top: -18px; font: 500 .62rem var(--f-m); color: var(--accent); transform: translateX(-50%); white-space: nowrap; }
.hero-meta { position: relative; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 18px; color: var(--mute); font-size: .95rem; }
.hero-meta a { color: var(--ink); }
.spec { border: 1px solid var(--line); border-radius: 22px; background: var(--panel); padding: 18px; display: grid; gap: 16px; align-content: start; }
.portrait { position: relative; aspect-ratio: 4 / 3.4; border-radius: 14px; overflow: hidden; background: var(--soft); }
.portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; display: block; filter: grayscale(.25) contrast(1.05); }
.portrait { cursor: pointer; }
.portrait canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.portrait.gen img { visibility: hidden; }
.portrait .seed { position: absolute; left: 36px; top: 13px; font: 500 .62rem var(--f-m); letter-spacing: .08em; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
.portrait .dprog { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.portrait .hud, .portrait .corner { z-index: 1; }
.portrait .hud { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; justify-content: space-between; font: 500 .66rem var(--f-m); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); letter-spacing: .06em; }
.portrait .corner { position: absolute; width: 18px; height: 18px; border: 2px solid #fff; opacity: .9; }
.portrait .c1 { left: 10px; top: 10px; border-right: 0; border-bottom: 0; } .portrait .c2 { right: 10px; top: 10px; border-left: 0; border-bottom: 0; }
.readouts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.readouts div { background: var(--panel); padding: 10px 12px; min-width: 0; }
.readouts b { display: block; font: 500 .9rem var(--f-m); overflow-wrap: anywhere; }
.readouts a { text-decoration: none; }

/* epoch scrubber */
.epoch { position: relative; height: 40px; margin: 0 2px; cursor: ew-resize; touch-action: none; outline-offset: 6px; }
.ep-rail { position: absolute; left: 6px; right: 64px; top: 58%; height: 1px; background: var(--line); }
.ep-rail .n { position: absolute; top: -4px; width: 1px; height: 9px; background: var(--mute); opacity: .45; }
.ep-rail .n span { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font: 500 .6rem var(--f-m); letter-spacing: .06em; color: var(--mute); opacity: 0; transition: opacity .35s; white-space: nowrap; }
.epoch:hover .n span, .epoch:focus-visible .n span, .epoch.drag .n span { opacity: .85; }
.ep-fill { position: absolute; left: 0; top: 0; height: 1px; width: var(--p, 100%); background: linear-gradient(90deg, transparent, var(--accent)); }
.ep-mark { position: absolute; top: 0; left: var(--p, 100%); width: 11px; height: 11px; margin: -5px 0 0 -5.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent), 0 0 16px var(--accent); animation: breathe 3.2s ease-in-out infinite; }
.epoch.snap .ep-mark, .epoch.snap .ep-fill { transition: left .45s cubic-bezier(.3, 1.4, .5, 1), width .45s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes breathe { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 8%, transparent), 0 0 22px var(--accent); } }
.ep-read { position: absolute; right: 0; top: 58%; transform: translateY(-50%); font: 500 .92rem var(--f-m); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.timewarp { transition: filter .2s; }

/* sections */
section { scroll-margin-top: 80px; }
.sec { padding-block: 56px 8px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.sec-head h2 { margin: 0; font: 600 clamp(1.6rem, 3.4vw, 2.3rem)/1.1 var(--f-d); letter-spacing: -.03em; }
.sec-head h2 span { color: var(--accent); font: 500 .8rem var(--f-m); letter-spacing: .1em; vertical-align: super; margin-right: 8px; }

/* bio + attention */
.bio-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 34px; align-items: start; }
.bio { position: relative; font-size: 1.14rem; line-height: 1.7; max-width: 66ch; }
.bio p { margin: 0 0 1em; }
.tok { border-radius: 4px; transition: background .2s, color .2s; }
.attn-on .tok { cursor: help; }
.attn-on .tok { background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent); }
.attn-on .tok.hot { background: var(--accent); color: #fff; }
.attn-on .tok.rel { background: color-mix(in srgb, var(--blue) 20%, transparent); }
.attn-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 1; }
.attn-svg path { fill: none; stroke: var(--blue); stroke-linecap: round; }
.tl-wrap { position: relative; }
.news-tools { display: flex; align-items: center; gap: 14px; margin: -8px 0 14px; }
.switch.sm { font-size: .88rem; }
.switch.sm input { width: 36px; height: 22px; }
.switch.sm input::after { width: 14px; height: 14px; }
.switch.sm input:checked::after { transform: translateX(14px); }
.side-card { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); padding: 18px; display: grid; gap: 12px; }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 600; }
.switch input { appearance: none; width: 44px; height: 26px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); position: relative; cursor: pointer; transition: background .2s; margin: 0; }
.switch input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); transition: transform .25s cubic-bezier(.3, 1.4, .5, 1); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); background: #fff; }
.side-card p { margin: 0; color: var(--mute); font-size: .92rem; }

/* news timeline */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { font: 500 .8rem var(--f-m); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--mute); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 118px; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
.timeline li { position: relative; display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 36px; padding: 12px 0; transition: opacity .3s; }
.timeline li[hidden] { display: none; }
.timeline time { font: 500 .85rem var(--f-m); color: var(--mute); text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
.timeline li::before { content: ""; position: absolute; left: 113px; top: 19px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2px solid var(--mute); }
.timeline li.now::before { background: var(--accent); border-color: var(--accent); animation: ping 2s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
.timeline .ev { font-size: 1.02rem; }
.timeline .tg { display: inline-block; font: 500 .66rem var(--f-m); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-right: 8px; vertical-align: 2px; }

/* instruments */
.lede { color: var(--mute); max-width: 66ch; margin: 0 0 22px; font-size: 1.05rem; }
.instruments { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.inst { border: 1px solid var(--line); border-radius: 20px; background: var(--panel); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.inst h3 { margin: 0; font: 600 1.08rem/1.2 var(--f-d); letter-spacing: -.02em; }
.inst p { margin: 0; color: var(--mute); font-size: .92rem; }
.inst canvas { width: 100%; height: 190px; display: block; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }
.ctrl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font: 500 .78rem var(--f-m); color: var(--mute); }
.ctrl input[type=range] { width: 100%; accent-color: var(--accent); }
.legend-row { display: flex; gap: 14px; font: 500 .74rem var(--f-m); color: var(--mute); flex-wrap: wrap; }
.legend-row i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 6px; }
.toks { display: flex; flex-wrap: wrap; gap: 6px; }
.toks button { font: 500 .82rem var(--f-m); padding: 4px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.toks button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.grid-lights { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; padding: 10px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }
.grid-lights span { aspect-ratio: 1; border-radius: 3px; background: color-mix(in srgb, var(--ink) 8%, transparent); transition: background .25s, box-shadow .25s; }
.feat { font: 500 .8rem var(--f-m); color: var(--ink); min-height: 1.4em; }
.btn { font: 500 .82rem var(--f-m); padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink); color: var(--ink); }
.btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.solid:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

/* papers */
.papers { display: grid; gap: 16px; }
.paper { border: 1px solid var(--line); border-radius: 20px; background: var(--panel); padding: 22px; display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 22px; }
.paper .yr { font: 600 1.4rem var(--f-d); letter-spacing: -.03em; }
.paper .yr small { display: block; font: 500 .7rem var(--f-m); color: var(--mute); letter-spacing: .06em; margin-top: 4px; }
.paper h3 { margin: 0 0 6px; font: 600 1.2rem/1.3 var(--f-d); letter-spacing: -.02em; text-wrap: balance; }
.paper .au { margin: 0 0 14px; color: var(--mute); }
.paper .au .me { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.paper .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.paper .abs { margin: 14px 0 0; padding: 14px 16px; border-left: 2px solid var(--accent); background: var(--soft); border-radius: 0 12px 12px 0; color: var(--ink); font-size: .96rem; }
.paper .abs[hidden] { display: none; }
footer { margin-top: 70px; border-top: 1px solid var(--line); }
footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding-block: 22px calc(30px + env(safe-area-inset-bottom, 0px)); color: var(--mute); font: 500 .8rem var(--f-m); }

/* command palette */
.pal { position: fixed; inset: 0; z-index: 100; background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; justify-items: center; align-items: start; padding: 12vh 16px 16px; }
.pal[hidden] { display: none; }
.pal-box { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 30px 80px rgba(0, 0, 0, .25); overflow: hidden; }
.pal input { width: 100%; font: 500 1.05rem var(--f); padding: 16px 18px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); outline: none; }
.pal ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.pal li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.pal li span:last-child { font: 500 .74rem var(--f-m); color: var(--mute); }
.pal li[aria-selected="true"] { background: var(--soft); box-shadow: inset 2px 0 0 var(--accent); }

@media (max-width: 960px) {
  .hero, .bio-grid { grid-template-columns: minmax(0, 1fr); }
  .instruments { grid-template-columns: minmax(0, 1fr); }
  .stage { min-height: 320px; }
}
@media (max-width: 640px) {
  .bar nav, .kbtn span { display: none; }
  .kbtn { margin-left: auto; }
  .timeline::before { left: 6px; }
  .timeline li { grid-template-columns: minmax(0, 1fr); gap: 2px; padding-left: 26px; }
  .timeline li::before { left: 1px; }
  .timeline time { text-align: left; }
  .paper { grid-template-columns: minmax(0, 1fr); gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { .timeline li.now::before { animation: none; } html { scroll-behavior: auto; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="mark" href="#top"><i></i>AK</a>
    <nav aria-label="Sections"><a href="#bio">Bio</a><a href="#news">News</a><a href="#research">Research</a><a href="#papers">Papers</a></nav>
    <button class="kbtn" id="open-pal" type="button" aria-label="Open command menu"><span>Jump to</span><kbd>⌘K</kbd></button>
    <button class="theme" id="theme" type="button" aria-label="Switch light or dark mode">◐</button>
  </div>
</header>

<main class="wrap" id="top">
  <section class="hero">
    <div class="stage" id="stage">
      <canvas id="particles" aria-hidden="true"></canvas>
      <span class="crew mono" id="crew" aria-hidden="true"></span>
      <h1 class="sr-name" id="name-h"></h1>
      <div class="fallback-name" aria-hidden="true" id="fallback"></div>
      <div style="position:relative">
        <div class="aligned" id="aligned" aria-label="AI Alignment"><span class="tick" style="left:0">x = 0</span><span class="tick" id="tick2">x = 1</span><span class="guide g1"></span><span class="guide g2"></span><span id="a1">AI</span><span id="a2">Alignment</span></div>
        <div class="hero-meta" id="hero-meta"></div>
      </div>

    document.querySelectorAll('#portrait .genvid, #portrait .genx').forEach(function (n) { n.remove(); });
    root.classList.remove('shadow'); colors();
    if (flowHooks) flowHooks.toPhoto();
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && appleOn) { stopApple(); return; }
  });

  /* ---------- command palette ---------- */
  var CMDS = [
    ['Go to Bio', 'section', function () { location.hash = 'bio'; }], ['Go to News', 'section', function () { location.hash = 'news'; }],
    ['Go to Research', 'section', function () { location.hash = 'research'; }], ['Go to Papers', 'section', function () { location.hash = 'papers'; }],
    ['Email Ayub', S.email, function () { location.href = 'mailto:' + S.email; }], ['Copy email address', 'clipboard', function () { navigator.clipboard && navigator.clipboard.writeText(S.email); }],
    ['GitHub', '@' + S.github, function () { window.open('https://github.com/' + S.github, '_blank', 'noopener'); }],
    ['Toggle light / dark', 'theme', function () { $('#theme').click(); }], ['Attention view on', 'bio', function () { setAttn(true); location.hash = 'bio'; }]
  ];
  S.papers.forEach(function (p) { CMDS.push(['Open “' + p.short + '”', 'arXiv ' + p.arxiv, function () { window.open(p.url, '_blank', 'noopener'); }]); });
  Era.list.forEach(function (e) { if (e.id !== 'now') CMDS.push(['Travel to the ' + (e.id === 'now' ? 'present' : '19' + e.label), 'era', function () { Era.go(e.id); }]); });
  var pal = $('#pal'), pin = $('#pal-in'), plist = $('#pal-list'), sel = 0, shownCmds = CMDS;
  function renderPal() {
    var q = pin.value.toLowerCase(); shownCmds = CMDS.filter(function (c) { return (c[0] + ' ' + c[1]).toLowerCase().indexOf(q) >= 0; });
    sel = Math.min(sel, Math.max(0, shownCmds.length - 1));
    plist.innerHTML = shownCmds.map(function (c, i) { return '<li role="option" data-i="' + i + '" aria-selected="' + (i === sel) + '"><span>' + S.esc(c[0]) + '</span><span>' + S.esc(c[1]) + '</span></li>'; }).join('') || '<li><span>No matches</span><span></span></li>';
  }
  function openPal() { pal.hidden = false; pin.value = ''; sel = 0; renderPal(); pin.focus(); }
  function closePal() { pal.hidden = true; }
  function runPal(i) { var c = shownCmds[i]; if (!c) return; closePal(); c[2](); }
  $('#open-pal').addEventListener('click', openPal);
  pin.addEventListener('input', function () { sel = 0; renderPal(); });
  pin.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { sel = Math.min(shownCmds.length - 1, sel + 1); renderPal(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); renderPal(); e.preventDefault(); }
    if (e.key === 'Enter') runPal(sel); if (e.key === 'Escape') closePal();
  });
  plist.addEventListener('click', function (e) { var li = e.target.closest('[data-i]'); if (li) runPal(+li.dataset.i); });
  pal.addEventListener('click', function (e) { if (e.target === pal) closePal(); });
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal.hidden ? openPal() : closePal(); }
    else if (e.key === '/' && pal.hidden && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); openPal(); }
  });

  /* ---------- boot ---------- */
  function redrawAll() { colors(); drawReward(); drawLoss(); if (reduce) frame(); }
  function start() { colors(); buildParticles(); alignGuides(); drawReward(); drawLoss(); frame(); }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
  var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { buildParticles(); alignGuides(); drawReward(); drawLoss(); if (reduce) frame(); }, 150); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawAll);
  if (/research/.test(location.hash)) { var jump = function () { $('#research').scrollIntoView({ behavior: 'instant', block: 'start' }); }; jump(); (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { setTimeout(jump, 30); }); }
})();
</script>
